<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebP Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 60px 0;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        header p {
            color: #8d8d98;
            font-size: 16px;
        }

        /* DROPZONE */

        .drop-zone {
            border: 2px dashed #292933;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            background: #111116;
            cursor: pointer;
            transition: .2s ease;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #7c5cff;
            background: #15121f;
        }

        .drop-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .drop-zone h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .drop-zone p {
            color: #777783;
            margin-bottom: 25px;
        }

        .button {
            border: none;
            background: #7c5cff;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .button:hover {
            background: #6948ff;
            transform: translateY(-1px);
        }

        #fileInput {
            display: none;
        }

        /* TOOLBAR */

        .toolbar {
            margin: 25px 0;
            padding: 16px;
            background: #111116;
            border: 1px solid #22222b;
            border-radius: 15px;

            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            color: #9999a5;
            font-size: 14px;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .select {
            background: #191920;
            color: white;
            border: 1px solid #2b2b35;
            padding: 11px 14px;
            border-radius: 9px;
            outline: none;
        }

        .secondary {
            background: #191920;
            border: 1px solid #2b2b35;
            color: white;
            padding: 11px 15px;
            border-radius: 9px;
            cursor: pointer;
        }

        .secondary:hover {
            background: #22222b;
        }

        /* IMAGES */

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .image-card {
            background: #111116;
            border: 1px solid #22222b;
            border-radius: 15px;
            overflow: hidden;
        }

        .preview {
            height: 210px;
            background:
                linear-gradient(45deg, #17171d 25%, transparent 25%),
                linear-gradient(-45deg, #17171d 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #17171d 75%),
                linear-gradient(-45deg, transparent 75%, #17171d 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-content {
            padding: 14px;
        }

        .filename {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .file-info {
            color: #777783;
            font-size: 12px;
            margin-bottom: 13px;
        }

        .card-buttons {
            display: flex;
            gap: 8px;
        }

        .download-button {
            flex: 1;
            border: none;
            background: #7c5cff;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-button {
            width: 40px;
            border: 1px solid #2b2b35;
            background: #191920;
            color: #ff6875;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .delete-button:hover {
            background: #24161a;
        }

        .empty {
            text-align: center;
            color: #666671;
            padding: 50px 0;
        }

        @media (max-width: 650px) {
            .container {
                padding: 30px 0;
            }

            header h1 {
                font-size: 32px;
            }

            .drop-zone {
                padding: 50px 15px;
            }

            .toolbar-spacer {
                display: none;
            }

            .toolbar > * {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>WebP Converter</h1>
        <p>
            Dépose tes images WebP et convertis-les instantanément en PNG ou JPG.
        </p>
    </header>


    <!-- DROPZONE -->

    <div class="drop-zone" id="dropZone">

        <div class="drop-icon">🖼️</div>

        <h2>Dépose tes images ici</h2>

        <p>
            Glisse plusieurs fichiers .webp ou sélectionne-les depuis ton appareil.
        </p>

        <button class="button" id="chooseButton">
            Choisir mes images
        </button>

        <input
            type="file"
            id="fileInput"
            accept="image/webp,.webp"
            multiple
        >

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar" id="toolbar" style="display:none;">

        <div class="toolbar-left" id="imageCount">
            0 image
        </div>

        <div class="toolbar-spacer"></div>

        <select class="select" id="formatSelect">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
        </select>

        <select class="select" id="qualitySelect">
            <option value="1">Qualité 100%</option>
            <option value="0.9">Qualité 90%</option>
            <option value="0.8">Qualité 80%</option>
            <option value="0.7">Qualité 70%</option>
        </select>

        <button class="button" id="downloadAll">
            Télécharger tout
        </button>

        <button class="secondary" id="clearAll">
            Tout supprimer
        </button>

    </div>


    <!-- IMAGES -->

    <div class="images-grid" id="imagesGrid"></div>

    <div class="empty" id="emptyMessage">
        Aucune image ajoutée.
    </div>

</div>


<script>

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const chooseButton = document.getElementById("chooseButton");

    const toolbar = document.getElementById("toolbar");
    const imagesGrid = document.getElementById("imagesGrid");
    const emptyMessage = document.getElementById("emptyMessage");

    const imageCount = document.getElementById("imageCount");

    const formatSelect = document.getElementById("formatSelect");
    const qualitySelect = document.getElementById("qualitySelect");

    const downloadAll = document.getElementById("downloadAll");
    const clearAll = document.getElementById("clearAll");


    let images = [];


    /* =========================
       CHOISIR DES FICHIERS
    ========================= */

    chooseButton.addEventListener("click", function(event) {

        event.stopPropagation();

        fileInput.click();

    });


    dropZone.addEventListener("click", function() {

        fileInput.click();

    });


    fileInput.addEventListener("change", function() {

        addFiles(fileInput.files);

        fileInput.value = "";

    });


    /* =========================
       DRAG & DROP
    ========================= */

    dropZone.addEventListener("dragover", function(event) {

        event.preventDefault();

        dropZone.classList.add("dragover");

    });


    dropZone.addEventListener("dragleave", function() {

        dropZone.classList.remove("dragover");

    });


    dropZone.addEventListener("drop", function(event) {

        event.preventDefault();

        dropZone.classList.remove("dragover");

        addFiles(event.dataTransfer.files);

    });


    /* =========================
       AJOUTER LES IMAGES
    ========================= */

    function addFiles(files) {

        const webpFiles = Array.from(files).filter(file => {

            return file.type === "image/webp" ||
                   file.name.toLowerCase().endsWith(".webp");

        });


        if (webpFiles.length === 0) {

            alert("Veuillez sélectionner des images .webp");

            return;

        }


        webpFiles.forEach(file => {

            const url = URL.createObjectURL(file);

            const img = new Image();

            img.onload = function() {

                images.push({

                    file: file,

                    url: url,

                    width: img.naturalWidth,

                    height: img.naturalHeight

                });

                renderImages();

            };

            img.src = url;

        });

    }


    /* =========================
       AFFICHER LES IMAGES
    ========================= */

    function renderImages() {

        imagesGrid.innerHTML = "";


        if (images.length === 0) {

            toolbar.style.display = "none";
            emptyMessage.style.display = "block";

            return;

        }


        toolbar.style.display = "flex";
        emptyMessage.style.display = "none";


        imageCount.textContent =
            images.length +
            (images.length > 1 ? " images" : " image");


        images.forEach((image, index) => {

            const card = document.createElement("div");

            card.className = "image-card";


            card.innerHTML = `

                <div class="preview">

                    <img src="${image.url}" alt="">

                </div>

                <div class="card-content">

                    <div class="filename" title="${escapeHTML(image.file.name)}">

                        ${escapeHTML(image.file.name)}

                    </div>

                    <div class="file-info">

                        ${image.width} × ${image.height}
                        ·
                        ${formatBytes(image.file.size)}

                    </div>

                    <div class="card-buttons">

                        <button
                            class="download-button"
                            onclick="downloadImage(${index})"
                        >

                            Télécharger ${formatSelect.value.toUpperCase()}

                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteImage(${index})"
                        >

                            ×

                        </button>

                    </div>

                </div>

            `;


            imagesGrid.appendChild(card);

        });

    }


    /* =========================
       SUPPRIMER UNE IMAGE
    ========================= */

    function deleteImage(index) {

        URL.revokeObjectURL(images[index].url);

        images.splice(index, 1);

        renderImages();

    }


    /* =========================
       SUPPRIMER TOUT
    ========================= */

    clearAll.addEventListener("click", function() {

        images.forEach(image => {

            URL.revokeObjectURL(image.url);

        });


        images = [];

        renderImages();

    });


    /* =========================
       CONVERSION
    ========================= */

    async function convertImage(image) {

        return new Promise((resolve, reject) => {

            const img = new Image();

            img.onload = function() {

                const canvas = document.createElement("canvas");

                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;


                const ctx = canvas.getContext("2d");


                /*
                    Pour le JPG, on met un fond blanc
                    car le JPG ne gère pas la transparence.
                */

                if (formatSelect.value === "jpg") {

                    ctx.fillStyle = "#ffffff";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                }


                ctx.drawImage(img, 0, 0);


                let mimeType;

                if (formatSelect.value === "png") {

                    mimeType = "image/png";

                } else {

                    mimeType = "image/jpeg";

                }


                const quality =
                    Number(qualitySelect.value);


                canvas.toBlob(

                    function(blob) {

                        if (!blob) {

                            reject(
                                new Error("Conversion impossible")
                            );

                            return;

                        }


                        resolve(blob);

                    },

                    mimeType,

                    quality

                );

            };


            img.onerror = reject;

            img.src = image.url;

        });

    }


    /* =========================
       TELECHARGER UNE IMAGE
    ========================= */

    async function downloadImage(index) {

        const image = images[index];


        try {

            const blob =
                await convertImage(image);


            const extension =
                formatSelect.value === "png"
                    ? "png"
                    : "jpg";


            const filename =
                image.file.name.replace(
                    /\.webp$/i,
                    ""
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                filename + "." + extension;


            document.body.appendChild(link);

            link.click();

            link.remove();


            URL.revokeObjectURL(url);

        }

        catch (error) {

            alert(
                "Une erreur est survenue pendant la conversion."
            );

        }

    }


    /* =========================
       TELECHARGER TOUT
    ========================= */

    downloadAll.addEventListener("click", async function() {

        if (images.length === 0) return;


        downloadAll.disabled = true;

        downloadAll.textContent =
            "Conversion...";


        for (let i = 0; i < images.length; i++) {

            await downloadImage(i);

            /*
                Petite pause pour éviter que
                le navigateur bloque les téléchargements.
            */

            await new Promise(resolve =>
                setTimeout(resolve, 150)
            );

        }


        downloadAll.disabled = false;

        downloadAll.textContent =
            "Télécharger tout";

    });


    /* =========================
       CHANGEMENT FORMAT
    ========================= */

    formatSelect.addEventListener("change", function() {

        renderImages();

    });


    /* =========================
       UTILITAIRES
    ========================= */

    function formatBytes(bytes) {

        if (bytes < 1024) {

            return bytes + " octets";

        }


        if (bytes < 1024 * 1024) {

            return (
                (bytes / 1024).toFixed(1)
                + " Ko"
            );

        }


        return (
            (bytes / (1024 * 1024)).toFixed(1)
            + " Mo"
        );

    }


    function escapeHTML(text) {

        return text.replace(/[&<>"']/g, function(char) {

            const entities = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            };

            return entities[char];

        });

    }


    /* Initialisation */

    renderImages();

</script>

</body>
</html>
